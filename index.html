<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OTP Tool - Realtime Global API v10</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; background: #ffffff; color: #000; padding: 10px; max-width: 480px; margin: auto; }
    
    .api-container { position: relative; margin-bottom: 5px; margin-top: 0; }
    textarea {
      width: 100%; padding: 10px; padding-bottom: 30px; margin: 0;
      font-size: 15px; background: #fff; color: #000;
      border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
      height: 75px; resize: none; display: block;
    }
    .api-actions { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 5px; }
    .api-actions button {
      width: auto; padding: 3px 8px; margin: 0; font-size: 11px;
      background: #e0e0e0; color: #333; border: 1px solid #ccc;
      border-radius: 4px; cursor: pointer;
    }
    .api-actions button:hover { background: #d0d0d0; }

    button {
      width: 100%; padding: 10px; margin: 5px 0;
      font-size: 16px; background: #007bff; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
    }
    
    .row { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
    .row input {
      flex: 1; height: 42px; padding: 0 10px; font-size: 16px;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;
    }
    .copy-btn {
      width: 110px; height: 42px; padding: 0; margin: 0; font-size: 16px;
      background: #6c757d; display: flex; align-items: center; justify-content: center;
    }
    
    .otp-row { display: flex; gap: 10px; margin-top: 10px; }
    .otp-label { font-weight: bold; margin-top: 10px; }
    .otp {
      flex: 1; font-size: 20px; text-align: center;
      font-weight: bold; padding: 12px;
      background: #fffbe6; color: #000;
      border: 1px solid #aaa; border-radius: 6px;
    }
    .popup {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 10px 20px; border-radius: 10px;
      display: none; z-index: 1000;
    }
    .phone-actions { display: flex; justify-content: space-between; gap: 10px; margin: 10px 0; }
    .phone-actions button { flex: 1; }
    .price-badge{
      display:inline-flex; align-items:center; padding:0 10px; height:42px; background:#ffe9a8;
      border:1px solid #d8b556; border-radius:6px; font-weight:600; white-space:nowrap; box-sizing:border-box;
    }

    /* CSS PHẦN LIST CLOUD SMART DETECT */
    .addon-divider { margin: 25px 0 15px 0; border: 0; border-top: 1px solid #eee; }
    .addon-section-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .favorite-box { border: 1px dashed #007bff; padding: 10px; border-radius: 6px; background: #f8f9fa; margin-bottom: 15px; }
    .fav-input-group { display: flex; gap: 5px; margin-bottom: 8px; }
    .fav-input-group input { flex: 1; padding: 6px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .fav-input-group button { width: auto; padding: 0 12px; font-size: 13px; background: #007bff; margin: 0; height: 34px; border-radius: 4px; }
    .fav-items-list { display: flex; flex-direction: column; gap: 6px; }
    
    .fav-row-item { display: flex; flex-direction: column; background: #e7f1ff; border: 1px solid #b8daff; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.2s; position: relative; }
    .fav-row-item:hover { background: #d0e3ff; }
    .fav-web-name { font-size: 11px; font-weight: bold; color: #fff; background: #007bff; padding: 1px 5px; border-radius: 3px; display: inline-block; margin-bottom: 4px; width: fit-content; }
    .fav-link-info { font-size: 13px; color: #222; font-weight: 500; line-height: 1.5; padding-right: 25px; }
    .fav-link-info span { color: #ff5722; font-weight: bold; }
    .fav-row-del { font-weight: bold; color: #dc3545; font-size: 20px; cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); padding: 5px; }
    .fav-row-del:hover { color: #bd2130; }

    .history-box { border: 1px solid #ffeeba; padding: 10px; border-radius: 6px; background: #fffdf5; }
    .history-items-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .history-number-btn { font-size: 12px; padding: 5px 10px; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .history-number-btn:hover { background: #ffeeba; }
    .sync-status { font-size: 11px; font-weight: normal; color: #6c757d; }
  </style>
</head>

<script>
const PROXY_URL = "https://sms-proxy.sms-proxy.workers.dev";
const JSONBIN_BIN_ID = "6a355370f5f4af5e290f87d1"; 
const JSONBIN_KEY = "$2a$10$AmnqLVXNWMpRs2bSc2bwB.GbEJNwj.JlkfXm6fq9w0H4ZYnibQR2G"; 

/* ==================================================================== */
/* 📚 BỘ CƠ SỞ DỮ LIỆU ĐẦY ĐỦ CÓ SẴN (DỰ PHÒNG CHUẨN XÁC 100%) */
let SERVICES_DICT = {
  "dp": "ProtonMail", "yw": "Grindr", "tg": "Telegram", "fb": "Facebook", "wa": "WhatsApp", 
  "go": "Google", "ig": "Instagram", "tw": "Twitter", "vi": "Viber", "tk": "TikTok", 
  "lf": "TikTok Lite", "qq": "Tencent QQ", "am": "Amazon", "nf": "Netflix", "wx": "WeChat", 
  "bl": "Bigo Live", "ba": "BlablaCar", "ds": "Discord", "ly": "Uber", "ma": "Mail.ru", 
  "me": "Line", "mm": "Microsoft", "re": "Reddit", "vk": "VKontakte", "wb": "Wildberries", 
  "ya": "Yandex", "zy": "Zalo", "ot": "Any other"
};

let COUNTRIES_DICT = {
  "0": "Russia", "1": "Ukraine", "2": "Kazakhstan", "3": "Guangzhou", "4": "China", "5": "Macau",
  "6": "Indonesia", "7": "Malaysia", "8": "Philippines", "9": "Vietnam", "10": "Thailand", 
  "11": "India", "12": "Taiwan", "13": "Hong Kong", "14": "Japan", "15": "Poland", "16": "United Kingdom",
  "17": "Madagascar", "18": "Congo", "19": "Nigeria", "21": "Egypt", "22": "Germany", "23": "Estonia",
  "24": "Azerbaijan", "25": "Oman", "29": "Peru", "32": "Romania", "36": "Canada", "44": "Lithuania", 
  "48": "Netherlands", "52": "Cyprus", "58": "Cambodia", "73": "Brazil", "86": "China", "108": "Bosnia and Herzegovina",
  "123": "Botswana", "187": "USA"
};
/* ==================================================================== */

let currentId = "", baseURL = "", apiKey = "";
let otpCodes = ["","","","","","","",""];
let checkInterval = null;
let price = "";

let cloudFavorites = [];
let localPhonesCache = [];

document.addEventListener("DOMContentLoaded", async () => {
  // Thực thi nạp đồng bộ thời gian thực
  await loadBowerDictionaries();

  const localBackup = localStorage.getItem("otp_cloud_flat_backup");
  if(localBackup) {
    cloudFavorites = JSON.parse(localBackup);
    renderFavoritesList();
  }
  fetchCloudData();
});

async function loadBowerDictionaries() {
  try {
    // 1. Đồng bộ và giải nén danh sách Dịch vụ
    const sRes = await fetch(PROXY_URL + "?url=" + encodeURIComponent("https://api.smsbower.com/sms/v1/guest/getServicesList"));
    const sData = await sRes.json();
    let sList = Array.isArray(sData) ? sData : (sData.record || sData.data || []);
    if(sList && sList.length > 0) {
      sList.forEach(item => {
        let code = item.code || item.service || item.id;
        let name = item.name || item.title;
        if(code && name) {
          SERVICES_DICT[String(code).toLowerCase().trim()] = String(name).trim();
        }
      });
    }
  } catch(e) { console.log("Sử dụng cơ sở dữ liệu dịch vụ có sẵn."); }

  try {
    // 2. Đồng bộ và giải nén danh sách Quốc gia
    const cRes = await fetch(PROXY_URL + "?url=" + encodeURIComponent("https://api.smsbower.com/sms/v1/guest/getCountries"));
    const cData = await cRes.json();
    let cList = Array.isArray(cData) ? cData : (cData.record || cData.data || []);
    if(cList && cList.length > 0) {
      cList.forEach(item => {
        let id = item.id !== undefined ? item.id : item.code;
        let name = item.name || item.title;
        if(id !== undefined && name) {
          COUNTRIES_DICT[String(id).trim()] = String(name).trim();
        }
      });
    }
  } catch(e) { console.log("Sử dụng cơ sở dữ liệu quốc gia có sẵn."); }

  // Luôn đảm bảo bẫy cứng cho mmo quy chuẩn
  SERVICES_DICT["dp"] = "ProtonMail";
  renderFavoritesList();
}

async function fetchCloudData() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      method: "GET",
      headers: { "X-Master-Key": JSONBIN_KEY }
    });
    const data = await res.json();
    let records = data.record ? data.record : data;
    
    if (Array.isArray(records)) {
      cloudFavorites = records.map(item => typeof item === 'object' ? item.url : item).filter(Boolean);
    } else {
      cloudFavorites = [];
    }
    
    localStorage.setItem("otp_cloud_flat_backup", JSON.stringify(cloudFavorites));
    renderFavoritesList();
    document.getElementById("syncStatus").innerText = "Đã kết nối đám mây! ✔️";
    document.getElementById("syncStatus").style.color = "green";
  } catch (e) {
    document.getElementById("syncStatus").innerText = "Lỗi nạp Cloud (Sử dụng data máy)";
    document.getElementById("syncStatus").style.color = "red";
  }
}

async function saveCloudData() {
  document.getElementById("syncStatus").innerText = "Đang đồng bộ... ⏳";
  localStorage.setItem("otp_cloud_flat_backup", JSON.stringify(cloudFavorites));
  
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN_KEY
      },
      body: JSON.stringify(cloudFavorites)
    });
    
    if(res.ok) {
      document.getElementById("syncStatus").innerText = "Đã lưu lên đám mây thành công! ✔️";
      document.getElementById("syncStatus").style.color = "green";
    }
  } catch (e) {
    document.getElementById("syncStatus").innerText = "Đã cập nhật thay đổi thành công! ✔️";
    document.getElementById("syncStatus").style.color = "green";
  }
}

async function pasteAPI() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById("apiLink").value = text;
  } catch (err) {
    showPopup("Không thể truy cập bộ nhớ tạm!");
  }
}

function clearAPI() {
  document.getElementById("apiLink").value = "";
}

function showPopup(msg) {
  const popup = document.getElementById("popup");
  popup.innerText = msg;
  popup.style.display = "block";
  setTimeout(() => popup.style.display = "none", 2000);
}

function copyText(id) {
  const input = document.getElementById(id);
  input.select();
  document.execCommand("copy");
  showPopup("Đã sao chép số!");
}

async function getNumber() {
  document.getElementById("loading").style.display = "inline";
  const link = document.getElementById("apiLink").value.trim();
  if (!link.includes("getNumber") && !link.includes("action=")) {
    document.getElementById("loading").style.display = "none";
    return alert("Link không đúng cấu trúc API.");
  }

  resetAll();
  clearInterval(checkInterval);
  otpCodes = ["","","","","","","",""];
  
  try {
    const parsed = new URL(link);
    baseURL = parsed.origin + parsed.pathname;
    apiKey = parsed.searchParams.get("api_key") || parsed.searchParams.get("apikey") || parsed.searchParams.get("token");
  } catch(e) {
    document.getElementById("loading").style.display = "none";
    return alert("Đường dẫn link bị lỗi định dạng.");
  }

  try {
    const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(link));
    const text = await res.text();

    let id = "", number = "";
    price = "";
    const raw = text.trim();

    if (raw.startsWith("ACCESS_NUMBER") || raw.startsWith("ACCESS_READY")) {
      const parts = raw.split(":");
      id = parts[1] || "";
      number = parts[2] || "";
      if (parts[3]) price = parts[3];
    }

    if (id && number) {
      currentId = id;
      document.getElementById("number").value = number;
      document.getElementById("phoneSection").style.display = "block";
      document.getElementById("otpSection").style.display = "block";
      document.getElementById("cancelBtn").style.display = "inline-block";
      document.getElementById("otp1-loading").style.display = "inline";

      if (price) {
        document.getElementById("priceBadge").textContent = "Giá: " + price;
        document.getElementById("priceBadge").style.display = "inline-block";
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(number).then(() => {
          showPopup("Đã tự động sao chép số!");
        }).catch(() => {
          const input = document.getElementById("number");
          input.select();
          document.execCommand("copy");
          showPopup("Đã tự động sao chép số!");
        });
      } else {
        const input = document.getElementById("number");
        input.select();
        document.execCommand("copy");
        showPopup("Đã tự động sao chép số!");
      }

      updateRecentPhonesCache(number, id, baseURL, apiKey, price);
      startOTPCheck();
    } else {
      alert("Không lấy được số.\n" + text);
    }
  } catch (e) {
    alert("Lỗi: " + e.message);
  }

  document.getElementById("loading").style.display = "none";
}

async function checkOTP() {
  if (!currentId) return;
  const url = `${baseURL}?api_key=${apiKey}&action=getStatus&id=${currentId}&nocache=${Math.random()}`;

  const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
  const text = await res.text();

  if (text.startsWith("STATUS_OK")) {
    const code = text.split(":")[1];
    let idx = otpCodes.findIndex(v => !v);
    if (idx === -1) return;

    if (idx > 0 && code === otpCodes[idx - 1]) {
      await requestNextOTP(idx + 1);
      return;
    }

    otpCodes[idx] = code;
    document.getElementById("otp" + (idx + 1)).innerText = code;
    document.getElementById("otp" + (idx + 1) + "-loading").style.display = "none";

    if (idx < 7) {
      document.getElementById("otp" + (idx + 2) + "-loading").style.display = "inline";
      await requestNextOTP(idx + 2);
    }
  }
}

async function requestNextOTP(n) {
  const url = `${baseURL}?api_key=${apiKey}&action=setStatus&id=${currentId}&status=3`;
  await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
}

function startOTPCheck() {
  clearInterval(checkInterval);
  checkInterval = setInterval(checkOTP, 5000);
}

async function cancelOrder() {
  const url = `${baseURL}?api_key=${apiKey}&action=setStatus&id=${currentId}&status=8`;
  await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
  showPopup("Đã hủy số!");
  resetAll();
}

function resetAll() {
  clearInterval(checkInterval);
  otpCodes = ["","","","","","","",""];
  currentId = ""; baseURL = ""; apiKey = ""; price = "";
  document.getElementById("number").value = "";
  for (let i = 1; i <= 8; i++) {
    document.getElementById("otp" + i).innerText = "______";
    document.getElementById("otp" + i + "-loading").style.display = "none";
  }
  document.getElementById("priceBadge").style.display = "none";
  document.getElementById("phoneSection").style.display = "none";
  document.getElementById("otpSection").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";
}

function saveToFavorites() {
  const urlInput = document.getElementById("favUrlInput").value.trim();
  if (!urlInput) return alert("Vui lòng nhập hoặc dán link trước!");
  
  if (!cloudFavorites.includes(urlInput)) {
    cloudFavorites.push(urlInput);
    renderFavoritesList();
    saveCloudData();
  }
  document.getElementById("favUrlInput").value = "";
}

function removeFavoriteItem(e, targetLink) {
  e.stopPropagation();
  if(!confirm("Xóa link này khỏi danh sách trực tuyến?")) return;
  cloudFavorites = cloudFavorites.filter(link => link !== targetLink);
  renderFavoritesList();
  saveCloudData();
}

function parseApiDetails(link) {
  let domain = "Unknown Web";
  let serviceName = "Mặc định";
  let countryName = "Mặc định";
  let providerOrOperator = "Tự động";

  try {
    const urlObj = new URL(link);
    domain = urlObj.hostname.replace("www.", ""); 
    
    let s = urlObj.searchParams.get("service") || urlObj.searchParams.get("name") || urlObj.searchParams.get("service_id");
    if(s) {
      let sKey = s.toLowerCase().trim();
      serviceName = SERVICES_DICT[sKey] ? `${SERVICES_DICT[sKey]} (${s.toUpperCase()})` : s.toUpperCase();
    }

    let c = urlObj.searchParams.get("country") || urlObj.searchParams.get("country_id") || urlObj.searchParams.get("nation");
    if(c) {
      let cKey = String(c).trim();
      countryName = COUNTRIES_DICT[cKey] ? `${COUNTRIES_DICT[cKey]} (${c})` : `Mã ${c}`;
    }

    let op = urlObj.searchParams.get("operator") || 
             urlObj.searchParams.get("provider") || 
             urlObj.searchParams.get("provider_id") ||
             urlObj.searchParams.get("providerIds");
    if(op) providerOrOperator = op;

  } catch(e) {
    domain = "API Link";
  }

  return { domain, serviceName, countryName, providerOrOperator };
}

function renderFavoritesList() {
  const listContainer = document.getElementById("favUrlsList");
  listContainer.innerHTML = "";
  
  cloudFavorites.forEach((link, idx) => {
    const row = document.createElement("div");
    row.className = "fav-row-item";
    
    const details = parseApiDetails(link);
    
    const webBadge = document.createElement("div");
    webBadge.className = "fav-web-name";
    webBadge.innerText = details.domain;
    
    const infoDiv = document.createElement("div");
    infoDiv.className = "fav-link-info";
    infoDiv.innerHTML = `${idx + 1}. Dịch vụ: <span>${details.serviceName}</span> | Quốc gia: <span>${details.countryName}</span> | Mạng: <span>${details.providerOrOperator}</span>`;
    infoDiv.title = link;
    
    row.onclick = () => {
      document.getElementById("apiLink").value = link;
      showPopup("Đã chọn: " + details.domain + " [" + details.serviceName + "]");
    };
    
    const delBtn = document.createElement("span");
    delBtn.className = "fav-row-del";
    delBtn.innerText = "×";
    delBtn.onclick = (e) => removeFavoriteItem(e, link);
    
    row.appendChild(webBadge);
    row.appendChild(infoDiv);
    row.appendChild(delBtn);
    listContainer.appendChild(row);
  });
}

function updateRecentPhonesCache(number, id, bUrl, aKey, prc) {
  localPhonesCache = localPhonesCache.filter(item => item.number !== number);
  localPhonesCache.unshift({ number, id, bUrl, aKey, prc });
  if (localPhonesCache.length > 5) localPhonesCache.pop();
  renderRecentPhones();
}

function renderRecentPhones() {
  const boxContainer = document.getElementById("recentPhonesBox");
  const listContainer = document.getElementById("recentPhonesList");
  listContainer.innerHTML = "";
  
  if (localPhonesCache.length === 0) {
    boxContainer.style.display = "none";
    return;
  }
  
  boxContainer.style.display = "block";
  localPhonesCache.forEach(item => {
    const btn = document.createElement("div");
    btn.className = "history-number-btn";
    btn.innerText = item.number;
    
    btn.onclick = () => {
      clearInterval(checkInterval);
      currentId = item.id; baseURL = item.bUrl; apiKey = item.aKey; price = item.prc;
      
      document.getElementById("number").value = item.number;
      document.getElementById("phoneSection").style.display = "block";
      document.getElementById("otpSection").style.display = "block";
      document.getElementById("cancelBtn").style.display = "inline-block";
      
      if (price) {
        document.getElementById("priceBadge").textContent = "Giá: " + price;
        document.getElementById("priceBadge").style.display = "inline-block";
      } else {
        document.getElementById("priceBadge").style.display = "none";
      }
      
      for (let i = 1; i <= 8; i++) {
        document.getElementById("otp" + i).innerText = "______";
        document.getElementById("otp" + i + "-loading").style.display = "none";
      }
      document.getElementById("otp1-loading").style.display = "inline";
      otpCodes = ["","","","","","","",""];
      
      startOTPCheck();
      showPopup("Đã mở lại số: " + item.number);
    };
    listContainer.appendChild(btn);
  });
}
</script>
