        function parseApiUrl(urlStr) {
            try {
                const urlObj = new URL(urlStr);
                const bUrl = urlObj.originObj ? urlObj.originObj : (urlObj.protocol + "//" + urlObj.host);
                const key = urlObj.searchParams.get("api_key") || urlObj.searchParams.get("apikey") || "";
                return { bUrl, key };
            } catch (e) {
                if (urlStr.includes("chothuethansoc.com")) {
                    const match = urlStr.match(/(https?:\/\/[^\/]+)/);
                    const keyMatch = urlStr.match(/(?:api_key|apikey)=([^&]+)/);
                    return {
                        bUrl: match ? match[1] : "https://chothuethansoc.com",
                        key: keyMatch ? keyMatch[1] : ""
                    };
                }
                return { bUrl: "", key: "" };
            }
        }

                .then(res => {
                    if (res.success && res.data) {
                        const d = res.data;
                        currentId = d.id;
                        price = d.price ? d.price + "đ" : "";
                        const phoneNum = d.number;

                        document.getElementById("number").value = phoneNum;
                        document.getElementById("phoneSection").style.display = "block";
                        document.getElementById("otpSection").style.display = "block";
                        document.getElementById("cancelBtn").style.display = "inline-block";

                        if (price) {
                            document.getElementById("priceBadge").textContent = "Giá: " + price;
                            document.getElementById("priceBadge").style.display = "inline-block";
                        }

                        document.getElementById("otp1-loading").style.display = "inline";

                        updateRecentPhonesCache(phoneNum, currentId, baseURL, apiKey, price, currentLink, otpCodes);
                        saveCurrentActiveStateToCache(phoneNum);

                        startOTPCheck();
                        showPopup("Mua số thành công!");
                    } else {
                        alert("Lỗi mua số: " + (res.message || "Không có số khả dụng hoặc tài khoản hết tiền."));
                    }
                })
                .catch(err => alert("Lỗi kết nối API mua số: " + err.message));
        }

        function copyPhone() {
            const num = document.getElementById("number");
            num.select();
            num.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(num.value).then(() => {
                showPopup("Đã sao chép số: " + num.value);
            });
        }

        function startOTPCheck() {
            if (!currentId) return;
            const checkUrl = `${baseURL}/api/activities/${currentId}?api_key=${apiKey}`;

            checkInterval = setInterval(() => {
                fetch(checkUrl)
                    .then(r => r.json())
                    .then(res => {
                        if (res.success && res.data) {
                            const d = res.data;
                            let localOtpsChanged = false;

                            if (d.status === "Sumited" || d.status === "Completed" || d.status === "Refunded") {
                                if (d.code) {
                                    const codesArr = Array.isArray(d.code) ? d.code : [d.code];
                                    for (let i = 0; i < 9; i++) {
                                        if (codesArr[i] && otpCodes[i] !== String(codesArr[i])) {
                                            otpCodes[i] = String(codesArr[i]);
                                            localOtpsChanged = true;
                                        }
                                    }
                                }
                                clearInterval(checkInterval);
                                for (let i = 1; i <= 9; i++) {
                                    document.getElementById("otp" + i + "-loading").style.display = "none";
                                    document.getElementById("otp" + i).innerText = otpCodes[i - 1] ? otpCodes[i - 1] : "___";
                                }
                                document.getElementById("cancelBtn").style.display = "none";
                                clearCurrentActiveStateCache();

                                if (localOtpsChanged) {
                                    const currentPhone = document.getElementById("number").value;
                                    syncOtpToRecentPhonesCache(currentPhone, otpCodes);
                                }
                                return;
                            }

                            if (d.code) {
                                const codesArr = Array.isArray(d.code) ? d.code : [d.code];
                                let nextSlotIndex = -1;

                                for (let i = 0; i < 9; i++) {
                                    if (codesArr[i]) {
                                        if (otpCodes[i] !== String(codesArr[i])) {
                                            otpCodes[i] = String(codesArr[i]);
                                            localOtpsChanged = true;
                                        }
                                        document.getElementById("otp" + (i + 1)).innerText = otpCodes[i];
                                        document.getElementById("otp" + (i + 1) + "-loading").style.display = "none";
                                    } else {
                                        if (nextSlotIndex === -1) nextSlotIndex = i;
                                        document.getElementById("otp" + (i + 1)).innerText = "___";
                                        document.getElementById("otp" + (i + 1) + "-loading").style.display = "none";
                                    }
                                }

                                if (nextSlotIndex !== -1) {
                                    document.getElementById("otp" + (nextSlotIndex + 1) + "-loading").style.display = "inline";
                                }

                                if (localOtpsChanged) {
                                    const currentPhone = document.getElementById("number").value;
                                    syncOtpToRecentPhonesCache(currentPhone, otpCodes);
                                    saveCurrentActiveStateToCache(currentPhone);
                                }
                            }
                        }
                    })
                    .catch(e => console.log("Lỗi check OTP:", e));
            }, 3500);
        }

        function cancelNumber() {
            if (!currentId) return;
            if (!confirm("Bạn chắc chắn muốn HỦY số điện thoại hiện tại?")) return;

            clearInterval(checkInterval);
            const cancelUrl = `${baseURL}/api/activities/${currentId}/cancel?api_key=${apiKey}`;

            fetch(cancelUrl)
                .then(r => r.json())
                .then(res => {
                    if (res.success) {
                        showPopup("Đã hủy số thành công!");
                        document.getElementById("cancelBtn").style.display = "none";
                        for (let i = 1; i <= 9; i++) {
                            document.getElementById("otp" + i + "-loading").style.display = "none";
                        }
                        clearCurrentActiveStateCache();
                    } else {
                        alert("Lỗi khi gửi yêu cầu hủy số: " + (res.message || "Vui lòng thử lại"));
                        startOTPCheck();
                    }
                })
                .catch(err => {
                    alert("Lỗi kết nối khi hủy số: " + err.message);
                    startOTPCheck();
                });
        }

        function fetchCloudData() {
            const proxyUrl = "https://script.google.com/macros/s/AKfycbzL5Tbe6fUvY24m7qC7C00yG1Z4Yt74X-qf6w_j_B1GZ0r6I3u7_qg7EwF6mZ6D2w3a/exec";
            fetch(proxyUrl)
                .then(r => r.json())
                .then(res => {
                    if (res && Array.isArray(res)) {
                        cloudFavorites = res;
                        localStorage.setItem("otp_cloud_struct_backup", JSON.stringify(cloudFavorites));
                        renderFavoritesList();
                    }
                })
                .catch(e => console.log("Lỗi đồng bộ Cloud:", e));
        }

        function addCurrentToFavorites() {
            const link = document.getElementById("apiLink").value.trim();
            const label = document.getElementById("favLabelInput").value.trim();

            if (!link) return alert("Vui lòng nhập hoặc chọn một link API trước!");
            if (!label) return alert("Vui lòng điền tên gợi nhớ cho liên kết này!");

            const parsed = parseApiUrl(link);
            if (!parsed.bUrl || !parsed.key) return alert("Cấu trúc liên kết API không hợp lệ!");

            const serviceIdMatch = link.match(/(?:serviceId|service_id|id)=([^&]+)/);
            const sId = serviceIdMatch ? serviceIdMatch[1] : "0";

            const payload = {
                action: "add",
                domain: parsed.bUrl.replace(/^https?:\/\//, ""),
                apiKey: parsed.key,
                serviceId: sId,
                serviceName: label,
                fullUrl: link
            };

            const proxyUrl = "https://script.google.com/macros/s/AKfycbzL5Tbe6fUvY24m7qC7C00yG1Z4Yt74X-qf6w_j_B1GZ0r6I3u7_qg7EwF6mZ6D2w3a/exec";

            showPopup("Đang gửi yêu cầu lưu lên Cloud...");
            fetch(proxyUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                showPopup("Đã gửi yêu cầu thêm! Đang tải lại dữ liệu...");
                document.getElementById("favLabelInput").value = "";
                setTimeout(fetchCloudData, 1500);
            })
            .catch(e => alert("Lỗi khi thêm liên kết: " + e.message));
        }

        function removeFavoriteItem(event, linkUrl) {
            event.stopPropagation();
            if (!confirm("Bạn có chắc chắn muốn xóa liên kết này khỏi Cloud?")) return;

            const payload = {
                action: "delete",
                fullUrl: linkUrl
            };

            const proxyUrl = "https://script.google.com/macros/s/AKfycbzL5Tbe6fUvY24m7qC7C00yG1Z4Yt74X-qf6w_j_B1GZ0r6I3u7_qg7EwF6mZ6D2w3a/exec";

            showPopup("Đang gửi yêu cầu xóa lên Cloud...");
            fetch(proxyUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                showPopup("Đã gửi yêu cầu xóa! Đang tải lại dữ liệu...");
                setTimeout(fetchCloudData, 1500);
            })
            .catch(e => alert("Lỗi khi xóa liên kết: " + e.message));
        }

        function renderFavoritesList() {
            const box = document.getElementById("favoritesList");
            box.innerHTML = "";

            if (cloudFavorites.length === 0) {
                box.innerHTML = '<div style="font-size:12px;color:#666;text-align:center;padding:10px;">Chưa có liên kết nào trên Cloud.</div>';
                return;
            }

            cloudFavorites.forEach(item => {
                const fullLink = item.fullUrl;
                const total = parseInt(item.totalScan || 0);
                const success = parseInt(item.successCount || 0);
                const cancel = parseInt(item.cancelCount || 0);

                let successRate = 0;
                let cancelRate = 0;
                if (total > 0) {
                    successRate = Math.round((success / total) * 100);
                    cancelRate = Math.round((cancel / total) * 100);
                }

                const row = document.createElement("div");
                row.className = "fav-row-item";

                const badge = document.createElement("span");
                badge.className = "fav-web-name";
                badge.innerText = item.domain;

                const info = document.createElement("div");
                info.className = "fav-link-info";
                info.innerHTML = `Ứng dụng: <span>${item.serviceName}</span> (ID: ${item.serviceId})`;

                const stats = document.createElement("div");
                stats.className = "fav-stats-bar";
                stats.innerHTML = `
                    <span class="stat-success">✓ Về: ${successRate}% (${success} lần)</span>
                    <span class="stat-cancel">✕ Hủy: ${cancelRate}% (${cancel} lần)</span>
                    <span class="stat-total">Tổng: ${total}</span>
                `;

                row.onclick = () => {
                    document.getElementById("apiLink").value = fullLink;
                    currentLink = fullLink;
                    cacheApiLink();
                    parseAndShowLinkInfo();
                    showPopup("Đã chọn: " + item.domain + " [" + item.serviceName + "]");
                };

                const delBtn = document.createElement("span");
                delBtn.className = "fav-row-del";
                delBtn.innerText = "×";
                delBtn.onclick = (e) => removeFavoriteItem(e, fullLink);

                row.appendChild(badge);
                row.appendChild(info);
                row.appendChild(stats);
                row.appendChild(delBtn);
                box.appendChild(row);
            });
        }

        function updateRecentPhonesCache(number, id, bUrl, aKey, prc, lnk, r_otps) {
            localPhonesCache = localPhonesCache.filter(item => item.number !== number);
            localPhonesCache.unshift({
                number: number,
                id: id,
                bUrl: bUrl,
                aKey: aKey,
                prc: prc,
                lnk: lnk,
                historyOtps: r_otps || ["", "", "", "", "", "", "", "", ""]
            });

            if (localPhonesCache.length > 12) localPhonesCache.pop();
            localStorage.setItem("otp_local_phones_cache", JSON.stringify(localPhonesCache));
            renderRecentPhones();
        }

        function syncOtpToRecentPhonesCache(number, targetOtps) {
            let changed = false;
            localPhonesCache.forEach(item => {
                if (item.number === number) {
                    item.historyOtps = [...targetOtps];
                    changed = true;
                }
            });
            if (changed) {
                localStorage.setItem("otp_local_phones_cache", JSON.stringify(localPhonesCache));
                renderRecentPhones();
            }
        }

        function renderRecentPhones() {
            const box = document.getElementById("recentPhonesBox");
            const list = document.getElementById("recentPhonesList");
            list.innerHTML = "";

            if (localPhonesCache.length === 0) {
                box.style.display = "none";
                return;
            }
            box.style.display = "block";

            localPhonesCache.forEach(item => {
                let otpCount = 0;
                if (item.historyOtps && Array.isArray(item.historyOtps)) {
                    otpCount = item.historyOtps.filter(x => x !== "").length;
                }

                const wrapper = document.createElement("div");
                wrapper.className = "history-wrapper";

                const btn = document.createElement("div");
                btn.className = "history-number-btn";
                btn.innerText = item.number;

                const badge = document.createElement("span");
                badge.className = "otp-count-badge " + (otpCount === 0 ? "badge-red" : "badge-green");
                badge.innerText = otpCount;

                btn.onclick = () => {
                    clearInterval(checkInterval);
                    currentId = item.id;
                    baseURL = item.bUrl;
                    apiKey = item.aKey;
                    price = item.prc;
                    currentLink = item.lnk;

                    document.getElementById("number").value = item.number;
                    document.getElementById("phoneSection").style.display = "block";
                    document.getElementById("otpSection").style.display = "block";
                    document.getElementById("cancelBtn").style.display = "inline-block";

                    if (price) {
                        document.getElementById("priceBadge").textContent = "Giá: " + price;
                        document.getElementById("priceBadge").style.display = "inline-block";
                    } else {
                        document.getElementById("priceBadge").style.display = "none";
                    }

                    otpCodes = item.historyOtps && item.historyOtps.length === 9 ? [...item.historyOtps] : ["", "", "", "", "", "", "", "", ""];
                    
                    let firstEmptyIndex = -1;
                    for (let i = 1; i <= 9; i++) {
                        const val = otpCodes[i - 1];
                        if (val) {
                            document.getElementById("otp" + i).innerText = val;
                            document.getElementById("otp" + i + "-loading").style.display = "none";
                        } else {
                            document.getElementById("otp" + i).innerText = "___";
                            if (firstEmptyIndex === -1) firstEmptyIndex = i;
                            document.getElementById("otp" + i + "-loading").style.display = "none";
                        }
                    }

                    if (firstEmptyIndex !== -1 && currentId) {
                        document.getElementById("otp" + firstEmptyIndex + "-loading").style.display = "inline";
                    }

                    saveCurrentActiveStateToCache(item.number);
                    parseAndShowLinkInfo(); // Cập nhật lại thông tin hiển thị của số cũ
                    startOTPCheck();
                    showPopup("Đã mở lại số & lịch sử OTP: " + item.number);
                };

                wrapper.appendChild(btn);
                wrapper.appendChild(badge);
                list.appendChild(wrapper);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const cachedList = localStorage.getItem("otp_local_phones_cache");
            if (cachedList) {
                localPhonesCache = JSON.parse(cachedList);
                renderRecentPhones();
            }

            const cachedCloud = localStorage.getItem("otp_cloud_struct_backup");
            if (cachedCloud) {
                cloudFavorites = JSON.parse(cachedCloud);
                renderFavoritesList();
            }
            fetchCloudData();

            const cachedLink = localStorage.getItem("otp_cached_api_link");
            if (cachedLink) {
                document.getElementById("apiLink").value = cachedLink;
                currentLink = cachedLink;
                parseAndShowLinkInfo();
            }

            const activeState = localStorage.getItem("otp_current_active_state");
            if (activeState) {
                const state = JSON.parse(activeState);
                currentId = state.currentId;
                baseURL = state.baseURL;
                apiKey = state.apiKey;
                price = state.price;
                currentLink = state.currentLink;
                otpCodes = state.otpCodes || ["", "", "", "", "", "", "", "", ""];

                document.getElementById("number").value = state.number;
                document.getElementById("phoneSection").style.display = "block";
                document.getElementById("otpSection").style.display = "block";
                document.getElementById("cancelBtn").style.display = "inline-block";

                if (price) {
                    document.getElementById("priceBadge").textContent = "Giá: " + price;
                    document.getElementById("priceBadge").style.display = "inline-block";
                }

                let firstEmptyIndex = -1;
                for (let i = 1; i <= 9; i++) {
                    const val = otpCodes[i - 1];
                    if (val) {
                        document.getElementById("otp" + i).innerText = val;
                        document.getElementById("otp" + i + "-loading").style.display = "none";
                    } else {
                        document.getElementById("otp" + i).innerText = "___";
                        if (firstEmptyIndex === -1) firstEmptyIndex = i;
                        document.getElementById("otp" + i + "-loading").style.display = "none";
                    }
                }

                if (firstEmptyIndex !== -1 && currentId) {
                    document.getElementById("otp" + firstEmptyIndex + "-loading").style.display = "inline";
                }

                parseAndShowLinkInfo();
                if (currentId) startOTPCheck();
            }
        });
    </script>
</body>
</html>
