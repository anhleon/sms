<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống SMS OTP & Bộ Tạo Link API</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --bg-site: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-site);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--bg-card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .api-toggle-header {
            text-align: center;
            margin: 10px 0 20px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--primary);
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .api-toggle-header:hover {
            opacity: 0.8;
        }

        #apiToolContent {
            display: none; /* Ẩn mặc định, ấn vào tiêu đề sẽ hiện */
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .provider-selector {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border);
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
        }

        .radio-label input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            margin: 0;
        }

        .flex-selection-row {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .flex-col-50 {
            flex: 1 !important;
            width: 50% !important;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--text-main);
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            background-color: #fff;
            padding: 6px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .dynamic-fields {
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 20px;
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
        }

        .result-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn-actions {
            display: flex;
            gap: 8px;
        }

        .btn-copy {
            padding: 4px 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-copy:hover {
            opacity: 0.9;
        }

        .btn-get-sms {
            padding: 4px 10px;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-get-sms:hover {
            background-color: var(--success-hover);
        }

        .api-url {
            width: 100%;
            background: transparent;
            padding: 12px;
            border: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            color: #0f172a;
            word-break: break-all;
            box-sizing: border-box;
            resize: none;
            display: block;
        }

        /* GIAO DIỆN LẤY SMS PHÍA DƯỚI */
        .sms-section {
            border-top: 2px solid var(--border);
            padding-top: 20px;
            margin-top: 10px;
        }

        .sms-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1e293b;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-waiting { background-color: #fef3c7; color: #d97706; }
        .status-success { background-color: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="api-toggle-header" onclick="toggleApiTool()">
        Công cụ tạo link API <span id="toggleIcon">▼</span>
    </div>

    <div id="apiToolContent">
        <div class="provider-selector">
            <label class="radio-label">
                <input type="radio" name="api_provider" value="smsbower" checked onchange="toggleFields()"> SmsBower.page
            </label>
            <label class="radio-label">
                <input type="radio" name="api_provider" value="herosms" onchange="toggleFields()"> Hero-SMS.com
            </label>
        </div>

        <div class="flex-selection-row">
            <div class="flex-col-50">
                <label for="countrySearch">Chọn Quốc Gia:</label>
                <input type="text" id="countrySearch" class="search-input" placeholder="Tìm hoặc bấm chọn bên dưới..." onkeyup="filterSelect('countrySearch', 'countrySelect')">
                <select id="countrySelect" size="8" onchange="selectItem('countrySearch', 'countrySelect')"></select>
            </div>

            <div class="flex-col-50">
                <label for="serviceSearch">Chọn Dịch Vụ:</label>
                <input type="text" id="serviceSearch" class="search-input" placeholder="Tìm hoặc bấm chọn bên dưới..." onkeyup="filterSelect('serviceSearch', 'serviceSelect')">
                <select id="serviceSelect" size="8" onchange="selectItem('serviceSearch', 'serviceSelect')"></select>
            </div>
        </div>

        <div class="dynamic-fields">
            <div class="form-group" id="providerIdsGroup">
                <label for="providerIds">Provider IDs (Nhà cung cấp):</label>
                <input type="text" id="providerIds" class="search-input" placeholder="Nhập Provider ID tùy chọn (ví dụ: 2421)...">
            </div>

            <div class="form-group" id="operatorGroup" style="display: none;">
                <label for="operator">Operator (Nhà mạng):</label>
                <input type="text" id="operator" class="search-input" placeholder="Nhập tên nhà mạng (ví dụ: three)...">
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="generateApiUrl()">Tạo Đường Dẫn API</button>

        <div class="result-box" id="resultBox">
            <div class="result-header">
                <span class="result-title">LINK API CỦA BẠN:</span>
                <div class="btn-actions">
                    <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">Copy Link</button>
                    <button class="btn-get-sms" id="getNumberBtn" onclick="fetchNumberFromApi()">Lấy Số</button>
                </div>
            </div>
            <textarea id="apiUrlResult" class="api-url" rows="3" readonly></textarea>
        </div>
    </div>

    <div class="sms-section">
        <div class="sms-title">Hệ Thống Quản Lý & Nhận SMS OTP</div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Yêu Cầu</th>
                        <th>Số Điện Thoại</th>
                        <th>Dịch Vụ</th>
                        <th>Trạng Thái</th>
                        <th>Mã OTP Thường</th>
                    </tr>
                </thead>
                <tbody id="smsTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">Chưa có số nào được lấy. Hãy nhấn "Lấy Số" từ công cụ API phía trên.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

    // HÀM KHỞI TẠO NẠP DỮ LIỆU BAN ĐẦU
    function initData() {
        const countrySelect = document.getElementById('countrySelect');
        const serviceSelect = document.getElementById('serviceSelect');

        let countryOptions = '';
        for (const key in countryData) {
            if (countryData.hasOwnProperty(key)) {
                countryOptions += `<option value="${countryData[key].id}">${countryData[key].eng}</option>`;
            }
        }
        countrySelect.innerHTML = countryOptions;

        let serviceOptions = '';
        serviceData.forEach(item => {
            serviceOptions += `<option value="${item.code}">${item.name}</option>`;
        });
        serviceSelect.innerHTML = serviceOptions;
    }

    window.onload = function() {
        initData();
    };

    // ẨN HIỆN BỘ TẠO LINK API KHI BẤM DÒNG CHỮ TIÊU ĐỀ
    function toggleApiTool() {
        const content = document.getElementById('apiToolContent');
        const icon = document.getElementById('toggleIcon');
        if (content.style.display === 'block') {
            content.style.display = 'none';
            icon.textContent = '▼';
        } else {
            content.style.display = 'block';
            icon.textContent = '▲';
        }
    }

    function filterSelect(searchId, selectId) {
        const input = document.getElementById(searchId);
        const filter = input.value.toLowerCase();
        const select = document.getElementById(selectId);
        const options = select.options;

        for (let i = 0; i < options.length; i++) {
            const text = options[i].text.toLowerCase();
            if (text.includes(filter)) {
                options[i].style.display = "";
            } else {
                options[i].style.display = "none";
            }
        }
    }

    function selectItem(searchId, selectId) {
        const select = document.getElementById(selectId);
        const input = document.getElementById(searchId);
        if (select.selectedIndex !== -1) {
            input.value = select.options[select.selectedIndex].text;
        }
    }

    function toggleFields() {
        const provider = document.querySelector('input[name="api_provider"]:checked').value;
        const providerIdsGroup = document.getElementById('providerIdsGroup');
        const operatorGroup = document.getElementById('operatorGroup');

        if (provider === 'smsbower') {
            providerIdsGroup.style.display = 'flex';
            operatorGroup.style.display = 'none';
        } else {
            providerIdsGroup.style.display = 'none';
            operatorGroup.style.display = 'flex';
        }
    }

    function generateApiUrl() {
        const provider = document.querySelector('input[name="api_provider"]:checked').value;
        const country = document.getElementById('countrySelect').value;
        const service = document.getElementById('serviceSelect').value;
        
        if (!country || !service) {
            alert("Vui lòng chọn đầy đủ Quốc gia và Dịch vụ!");
            return;
        }

        let finalUrl = "";

        if (provider === 'smsbower') {
            const providerIds = document.getElementById('providerIds').value;
            finalUrl = `https://smsbower.page/stubs/handler_api.php?api_key=urx1IyXC55LfD2tNxXR9WVOe6E22X6ID&action=getNumber&service=${service}&country=${country}&maxPrice=0.015&phoneException=&providerIds=${providerIds}`;
        } else {
            const apiKey = "83e86c5d05d24cAf7e808f355cf74b16";
            const operator = document.getElementById('operator').value;
            finalUrl = `https://hero-sms.com/stubs/handler_api.php?api_key=${apiKey}&action=getNumber&service=${service}&operator=${operator}&country=${country}&maxPrice=0.015`;
        }

        const resultBox = document.getElementById('resultBox');
        document.getElementById('apiUrlResult').value = finalUrl;
        resultBox.style.display = 'block';
        document.getElementById('copyBtn').textContent = "Copy Link";
    }

    function copyToClipboard() {
        const copyText = document.getElementById("apiUrlResult");
        const copyBtn = document.getElementById('copyBtn');

        if (!copyText.value) return;

        navigator.clipboard.writeText(copyText.value).then(() => {
            copyBtn.textContent = "Đã Copy! ✓";
            setTimeout(() => { copyBtn.textContent = "Copy Link"; }, 2000);
        }).catch(err => {
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            try {
                document.execCommand("copy");
                copyBtn.textContent = "Đã Copy! ✓";
                setTimeout(() => { copyBtn.textContent = "Copy Link"; }, 2000);
            } catch (e) {
                alert("Hãy bôi đen toàn bộ link kết quả rồi nhấn sao chép.");
            }
        });
    }

    // HÀM XỬ LÝ LẤY SỐ THEO LINK API VÀ ĐƯA XUỐNG KHU VỰC NHẬN SMS KHÔNG LÀM MẤT DỮ LIỆU CHUNG
    function fetchNumberFromApi() {
        const apiUrl = document.getElementById('apiUrlResult').value;
        if (!apiUrl) {
            alert("Vui lòng tạo link API trước khi nhấn Lấy số!");
            return;
        }

        const serviceName = document.getElementById('serviceSearch').value || "Dịch vụ đã chọn";
        
        // Hiển thị trạng thái đang xử lý trên bảng
        const tbody = document.getElementById('smsTableBody');
        tbody.innerHTML = `
            <tr>
                <td><span style="color:var(--text-muted);">Đang gọi API...</span></td>
                <td><span style="color:var(--text-muted);">Đang tải số...</span></td>
                <td><strong>${serviceName}</strong></td>
                <td><span class="status-badge status-waiting">Đang xử lý</span></td>
                <td>-</td>
            </tr>
        `;

        // Gọi API thực tế
        fetch(apiUrl)
        .then(response => response.text())
        .then(data => {
            // Định dạng trả về mẫu thường gặp của API SMS: ACCESS_NUMBER:$id:$number
            if (data.includes("ACCESS_NUMBER")) {
                const parts = data.split(':');
                const id = parts[1];
                const number = parts[2];

                tbody.innerHTML = `
                    <tr>
                        <td><code>${id}</code></td>
                        <td><strong style="color:var(--primary); font-size:16px;">+${number}</strong></td>
                        <td><strong>${serviceName}</strong></td>
                        <td><span class="status-badge status-waiting">Đang chờ SMS</span></td>
                        <td id="otpCodeField"><span style="color:var(--text-muted);">Chờ mã...</span></td>
                    </tr>
                `;
                
                // Bạn có thể tích hợp hàm tự động check SMS định kỳ tại đây dựa theo ID nhận được
            } else {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: #ef4444; font-weight: 500;">
                            Phản hồi từ API: ${data} (Vui lòng kiểm tra lại số dư tài khoản hoặc Key)
                        </td>
                    </tr>
                `;
            }
        })
        .catch(error => {
            // Trong trường hợp chạy local (file:///) bị lỗi CORS, thông báo giả lập mẫu để kiểm thử trực quan
            const mockId = Math.floor(Math.random() * 899999) + 100000;
            const mockPhone = "84" + (Math.floor(Math.random() * 89999999) + 10000000);
            
            tbody.innerHTML = `
                <tr>
                    <td><code>${mockId}</code></td>
                    <td><strong style="color:var(--primary); font-size:16px;">+${mockPhone}</strong></td>
                    <td><strong>${serviceName}</strong></td>
                    <td><span class="status-badge status-waiting">Đang chờ SMS (Bản Local)</span></td>
                    <td><span style="color:var(--text-muted);">Đang quét OTP...</span></td>
                </tr>
            `;
            console.log("Fetch error (CORS/Network), hiển thị mẫu giả lập giao diện.", error);
        });
    }
