<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OTP Tool - 8x Multi-OTP Version</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; background: #ffffff; color: #000; padding: 10px; max-width: 480px; margin: auto; }
    .api-container { position: relative; margin-bottom: 5px; }
    textarea {
      width: 100%; padding: 10px; padding-bottom: 30px; margin: 0;
      font-size: 15px; background: #fff; color: #000;
      border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
      height: 75px; resize: none; display: block;
    }
    .api-actions { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 5px; }
    .api-actions button {
      width: auto; padding: 3px 8px; margin: 0; font-size: 11px;
      background: #e0e0e0; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
    }
    button { width: 100%; padding: 10px; margin: 5px 0; font-size: 16px; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
    .row input { flex: 1; height: 42px; padding: 0 10px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    .copy-btn { width: 110px; height: 42px; padding: 0; margin: 0; font-size: 16px; background: #6c757d; display: flex; align-items: center; justify-content: center; }
    
    /* GIAO DIỆN 8 Ô OTP NHỎ GỌN TRÊN 2 CỘT */
    .otp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .otp-card { border: 1px solid #aaa; border-radius: 6px; background: #fffbe6; padding: 8px; text-align: center; }
    .otp-card-title { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 4px; display: flex; justify-content: center; align-items: center; gap: 4px; }
    .otp-card-num { font-size: 18px; font-weight: bold; color: #000; letter-spacing: 1px; }
    .loading-gif { height: 12px; display: none; }

    .popup { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 10px; display: none; z-index: 1000; }
    .phone-actions { display: flex; justify-content: space-between; gap: 10px; margin: 10px 0; }
    .phone-actions button { flex: 1; }
    .price-badge { display:inline-flex; align-items:center; padding:0 10px; height:42px; background:#ffe9a8; border:1px solid #d8b556; border-radius:6px; font-weight:600; white-space:nowrap; box-sizing:border-box; }
    
    /* CLOUD LIST */
    .addon-divider { margin: 25px 0 15px 0; border: 0; border-top: 1px solid #eee; }
    .addon-section-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .favorite-box { border: 1px dashed #007bff; padding: 10px; border-radius: 6px; background: #f8f9fa; margin-bottom: 15px; }
    .fav-input-group { display: flex; gap: 5px; margin-bottom: 8px; }
    .fav-input-group input { flex: 1; padding: 6px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .fav-input-group button { width: auto; padding: 0 12px; font-size: 13px; background: #007bff; margin: 0; height: 34px; border-radius: 4px; }
    .fav-items-list { display: flex; flex-direction: column; gap: 6px; }
    .fav-row-item { display: flex; flex-direction: column; background: #e7f1ff; border: 1px solid #b8daff; padding: 8px 10px; border-radius: 6px; cursor: pointer; position: relative; }
    .fav-web-name { font-size: 11px; font-weight: bold; color: #fff; background: #007bff; padding: 1px 5px; border-radius: 3px; display: inline-block; margin-bottom: 4px; width: fit-content; }
    .fav-link-info { font-size: 13px; color: #222; font-weight: 500; padding-right: 25px; }
    .fav-link-info span { color: #ff5722; font-weight: bold; }
    .fav-stats-bar { display: flex; gap: 10px; font-size: 11px; margin-top: 5px; background: rgba(255,255,255,0.6); padding: 3px 6px; border-radius: 4px; border: 1px solid #e2e8f0; width: fit-content; }
    .stat-success { color: #28a745; font-weight: bold; }
    .stat-cancel { color: #dc3545; font-weight: bold; }
    .fav-row-del { font-weight: bold; color: #dc3545; font-size: 20px; cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); padding: 5px; }
    .sync-status { font-size: 11px; color: #6c757d; }
  </style>
</head>
<body>

<div class="api-container">
  <textarea id="apiLink" placeholder="Dán link API getNumber tại đây"></textarea>
  <div class="api-actions">
    <button onclick="pasteAPI()">Dán</button>
    <button onclick="clearAPI()">Xóa</button>
  </div>
</div>

<div class="phone-actions">
  <button onclick="getNumber()">Lấy số <span id="loading" style="display:none;">⏳</span></button>
  <button onclick="cancelOrder()" style="display:none;" id="cancelBtn">Hủy số</button>
</div>

<div id="phoneSection" style="display:none;">
  <div class="row" style="align-items:stretch;">
    <input id="number" readonly />
    <span id="priceBadge" class="price-badge" style="display:none;">Giá: —</span>
    <button class="copy-btn" onclick="copyText('number')">Sao chép</button>
  </div>
</div>

<div id="otpSection" style="display:none;">
  <div class="otp-grid">
    <div class="otp-card"><div class="otp-card-title">Mã 1 <img id="loading-otp1" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp1" class="otp-card-num">______</div></div>
    <div class="otp-card"><div class="otp-card-title">Mã 2 <img id="loading-otp2" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp2" class="otp-card-num">______</div></div>
    <div class="otp-card"><div class="otp-card-title">Mã 3 <img id="loading-otp3" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp3" class="otp-card-num">______</div></div>
    <div class="otp-card"><div class="otp-card-title">Mã 4 <img id="loading-otp4" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp4" class="otp-card-num">______</div></div>
    <div class="otp-card"><div class="otp-card-title">Mã 5 <img id="loading-otp5" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp5" class="otp-card-num">______</div></div>
    <div class="otp-card"><div class="otp-card-title">Mã 6 <img id="loading-otp6" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp6" class="otp-card-num">______</div></div>
    <div class="otp-card"><div class="otp-card-title">Mã 7 <img id="loading-otp7" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp7" class="otp-card-num">______</div></div>
    <div class="otp-card"><div class="otp-card-title">Mã 8 <img id="loading-otp8" class="loading-gif" src="https://i.imgur.com/llF5iyg.gif"/></div><div id="otp8" class="otp-card-num">______</div></div>
  </div>
  <div id="status" style="margin-top: 10px; font-size: 13px; color: #555;">Đang quét mã trực tuyến...</div>
</div>

<div id="popup" class="popup"></div>

<hr class="addon-divider">
<div class="favorite-box">
  <div class="addon-section-title">
    <span>Xếp hạng Link Đám Mây Trực Tuyến:</span>
    <button onclick="fetchCloudData()" style="width:auto; padding:2px 8px; font-size:11px; margin:0; background:#28a745;">Làm mới 🔄</button>
  </div>
  <div style="margin-bottom: 8px;"><span class="sync-status" id="syncStatus">Đang tải Cloud... ⏳</span></div>
  <div class="fav-input-group">
    <input type="text" id="favUrlInput" placeholder="Thêm thủ công link API..." />
    <button onclick="saveToFavorites()">Thêm và lưu Cloud</button>
  </div>
  <div class="fav-items-list" id="favUrlsList"></div>
</div>

<script>
const PROXY_URL = "https://sms-proxy.sms-proxy.workers.dev";
const JSONBIN_BIN_ID = "6a355370f5f4af5e290f87d1"; 
const JSONBIN_KEY = "$2a$10$AmnqLVXNWMpRs2bSc2bwB.GbEJNwj.JlkfXm6fq9w0H4ZYnibQR2G"; 

let currentId = "", baseURL = "", apiKey = "", currentLink = "";
// TĂNG LÊN 8 PHẦN TỬ TRONG MẢNG LƯU TRỮ MÃ
let otpCodes = ["","","","","","","",""]; 
let checkInterval = null;
let price = "";
let cloudFavorites = []; 

document.addEventListener("DOMContentLoaded", () => {
  const localBackup = localStorage.getItem("otp_cloud_struct_backup");
  if(localBackup) { cloudFavorites = JSON.parse(localBackup); renderFavoritesList(); }
  fetchCloudData();
});

async function fetchCloudData() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, { method: "GET", headers: { "X-Master-Key": JSONBIN_KEY } });
    const data = await res.json();
    let records = data.record ? data.record : data;
    if (Array.isArray(records)) {
      cloudFavorites = records.map(item => typeof item === 'string' ? { url: item, successCount: 0, cancelCount: 0 } : item);
    }
    localStorage.setItem("otp_cloud_struct_backup", JSON.stringify(cloudFavorites));
    renderFavoritesList();
    document.getElementById("syncStatus").innerText = "Đồng bộ Đám mây Online thành công! ✔️";
    document.getElementById("syncStatus").style.color = "green";
  } catch (e) { document.getElementById("syncStatus").innerText = "Lỗi nạp Cloud"; }
}

async function saveCloudData() {
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
      body: JSON.stringify(cloudFavorites)
    });
  } catch (e) {}
}

async function updateLinkStats(isSuccess) {
  if (!currentLink) return;
  let target = cloudFavorites.find(item => item.url === currentLink);
  if (target) {
    if (isSuccess) target.successCount = (target.successCount || 0) + 1;
    else target.cancelCount = (target.cancelCount || 0) + 1;
  } else if (isSuccess) {
    cloudFavorites.push({ url: currentLink, successCount: 1, cancelCount: 0 });
  }
  renderFavoritesList();
  await saveCloudData();
}

async function getNumber() {
  document.getElementById("loading").style.display = "inline";
  const link = document.getElementById("apiLink").value.trim();
  if (!link) return (document.getElementById("loading").style.display = "none");
  resetAll();
  currentLink = link; 
  
  try {
    const parsed = new URL(link);
    baseURL = parsed.origin + parsed.pathname;
    apiKey = parsed.searchParams.get("api_key") || parsed.searchParams.get("apikey") || parsed.searchParams.get("token");
  } catch(e) { document.getElementById("loading").style.display = "none"; return alert("Link sai định dạng"); }

  try {
    const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(link));
    const text = await res.text();
    const raw = text.trim();
    let id = "", number = "";

    if (raw.startsWith("ACCESS_NUMBER") || raw.startsWith("ACCESS_READY")) {
      const parts = raw.split(":");
      id = parts[1] || ""; number = parts[2] || "";
      if (parts[3]) price = parts[3];
    }

    if (id && number) {
      currentId = id;
      document.getElementById("number").value = number;
      document.getElementById("phoneSection").style.display = "block";
      document.getElementById("otpSection").style.display = "block";
      document.getElementById("cancelBtn").style.display = "inline-block";
      document.getElementById("loading-otp1").style.display = "inline";

      if (price) {
        document.getElementById("priceBadge").textContent = "Giá: " + price;
        document.getElementById("priceBadge").style.display = "inline-block";
      }
      startOTPCheck();
    } else { 
      alert("Không lấy được số: " + text); 
      await updateLinkStats(false);
    }
  } catch (e) { alert("Lỗi kết nối API"); }
  document.getElementById("loading").style.display = "none";
}

async function checkOTP() {
  if (!currentId) return;
  const url = `${baseURL}?api_key=${apiKey}&action=getStatus&id=${currentId}&nocache=${Math.random()}`;
  const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
  const text = await res.text();

  if (text.startsWith("STATUS_OK")) {
    const code = text.split(":")[1];
    let idx = otpCodes.findIndex(v => !v);
    if (idx === -1) return;
    
    // Nếu trùng mã cũ, kích hoạt yêu cầu mã tiếp theo luôn
    if (idx > 0 && code === otpCodes[idx - 1]) {
      await requestNextOTP(idx + 1); return;
    }
    
    if (idx === 0) await updateLinkStats(true);

    otpCodes[idx] = code;
    document.getElementById("otp" + (idx + 1)).innerText = code;
    document.getElementById("loading-otp" + (idx + 1)).style.display = "none";
    
    // TĂNG GIỚI HẠN LÊN TỐI ĐA 8 MÃ (idx chạy từ 0 đến 7)
    if (idx < 7) {
      document.getElementById("loading-otp" + (idx + 2)).style.display = "inline";
      await requestNextOTP(idx + 2);
    }
  } else if (text === "STATUS_CANCELED") {
    resetAll();
  }
}

async function requestNextOTP(n) {
  // Gửi lệnh status=3 báo cho hệ thống chuẩn bị nhận OTP số n tiếp theo
  const url = `${baseURL}?api_key=${apiKey}&action=setStatus&id=${currentId}&status=3`;
  await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
}

function startOTPCheck() { clearInterval(checkInterval); checkInterval = setInterval(checkOTP, 5000); }

async function cancelOrder() {
  const url = `${baseURL}?api_key=${apiKey}&action=setStatus&id=${currentId}&status=8`;
  await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
  await updateLinkStats(false); 
  resetAll();
}

function resetAll() {
  clearInterval(checkInterval);
  otpCodes = ["","","","","","","",""]; currentId = ""; price = "";
  document.getElementById("number").value = "";
  for (let i = 1; i <= 8; i++) {
    document.getElementById("otp" + i).innerText = "______";
    document.getElementById("loading-otp" + i).style.display = "none";
  }
  document.getElementById("phoneSection").style.display = "none";
  document.getElementById("otpSection").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";
}

function pasteAPI() { navigator.clipboard.readText().then(t => document.getElementById("apiLink").value = t); }
function clearAPI() { document.getElementById("apiLink").value = ""; }
function showPopup(m) { const p = document.getElementById("popup"); p.innerText = m; p.style.display = "block"; setTimeout(() => p.style.display="none", 2000); }
function copyText(id) { const i = document.getElementById(id); i.select(); document.execCommand("copy"); showPopup("Đã copy số!"); }

function renderFavoritesList() {
  const listContainer = document.getElementById("favUrlsList");
  listContainer.innerHTML = "";
  cloudFavorites.forEach((item, idx) => {
    const row = document.createElement("div"); row.className = "fav-row-item";
    row.innerHTML = `<div class="fav-link-info">${idx+1}. Link API: <span>${item.url.substring(0,45)}...</span></div>`;
    row.onclick = () => { document.getElementById("apiLink").value = item.url; currentLink = item.url; };
    listContainer.appendChild(row);
  });
}
</script>
</body>
</html>
