let currentId = "", baseURL = "", apiKey = "", currentLink = "";
let otpCodes = ["","","","","","","","",""]; 
let checkInterval = null;
let price = "";
let cloudFavorites = []; 
let localPhonesCache = [];

document.addEventListener("DOMContentLoaded", () => {
  // 1. Phục hồi 5 số gần đây từ bộ nhớ máy hiện tại
  const savedCache = localStorage.getItem("otp_local_phones_cache");
  if(savedCache) {
    localPhonesCache = JSON.parse(savedCache);
    renderRecentPhones();
  }

  // 2. Phục hồi danh sách Cloud dự phòng từ máy
  const localBackup = localStorage.getItem("otp_cloud_struct_backup");
  if(localBackup) {
    cloudFavorites = JSON.parse(localBackup);
    renderFavoritesList();
  }
  fetchCloudData(); // Đồng bộ chung từ Cloud như cũ

  // 3. KHÔI PHỤC TRẠNG THÁI SỐ, LINK VÀ LƯỚI OTP TRÊN RIÊNG MÁY NÀY KHI F5
  const cachedLink = localStorage.getItem("otp_cached_api_link");
  if (cachedLink) {
    document.getElementById("apiLink").value = cachedLink;
    currentLink = cachedLink;
  }

  const savedState = localStorage.getItem("otp_current_active_state");
  if (savedState) {
    const state = JSON.parse(savedState);
    currentId = state.currentId;
    baseURL = state.baseURL;
    apiKey = state.apiKey;
    price = state.price;
    currentLink = state.currentLink;
    otpCodes = state.otpCodes || ["","","","","","","","",""];

    document.getElementById("number").value = state.number;
    document.getElementById("phoneSection").style.display = "block";
    document.getElementById("otpSection").style.display = "block";
    document.getElementById("cancelBtn").style.display = "inline-block";

    if (price) {
      document.getElementById("priceBadge").textContent = "Giá: " + price;
      document.getElementById("priceBadge").style.display = "inline-block";
    }

    // Đổ lại dữ liệu lưới 9 ô OTP cũ
    let nextLoadingIndex = -1;
    for (let i = 1; i <= 9; i++) {
      const codeVal = otpCodes[i - 1];
      if (codeVal) {
        document.getElementById("otp" + i).innerText = codeVal;
        document.getElementById("otp" + i + "-loading").style.display = "none";
      } else {
        document.getElementById("otp" + i).innerText = "___";
        if (nextLoadingIndex === -1) nextLoadingIndex = i;
        document.getElementById("otp" + i + "-loading").style.display = "none";
      }
    }
    
    if (nextLoadingIndex !== -1 && currentId) {
      document.getElementById("otp" + nextLoadingIndex + "-loading").style.display = "inline";
    }

    // Tự động quét tiếp tục nhận OTP bình thường sau khi F5
    if (currentId) {
      startOTPCheck();
    }
  }
});

  const link = document.getElementById("apiLink").value.trim();
  localStorage.setItem("otp_cached_api_link", link);
}

  const state = {
    currentId, baseURL, apiKey, price, currentLink, number, otpCodes

}

// KHU VỰC ĐỒNG BỘ CHUNG CỦA ĐÁM MÂY (GIỮ NGUYÊN TÍNH NĂNG CŨ)
async function fetchCloudData() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      method: "GET", headers: { "X-Master-Key": JSONBIN_KEY }
    });
    const data = await res.json();
    let records = data.record ? data.record : data;
    
    if (Array.isArray(records)) {
      cloudFavorites = records.map(item => {
        if (typeof item === 'string') return { url: item, successCount: 0, cancelCount: 0 };
        return { url: item.url, successCount: item.successCount || 0, cancelCount: item.cancelCount || 0 };
      });
    } else { cloudFavorites = []; }
    
    localStorage.setItem("otp_cloud_struct_backup", JSON.stringify(cloudFavorites));
    renderFavoritesList();
    document.getElementById("syncStatus").innerText = "Đồng bộ Đám mây Online thành công! ✔️";
    document.getElementById("syncStatus").style.color = "green";
  } catch (e) {
    document.getElementById("syncStatus").innerText = "Lỗi nạp Cloud trực tuyến";
    document.getElementById("syncStatus").style.color = "red";
  }
}

async function saveCloudData() {
  document.getElementById("syncStatus").innerText = "Đang đồng bộ Cloud... ⏳";
  localStorage.setItem("otp_cloud_struct_backup", JSON.stringify(cloudFavorites));
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
      body: JSON.stringify(cloudFavorites)
    });
    if(res.ok) {
      document.getElementById("syncStatus").innerText = "Đã lưu đám mây! ✔️";
      document.getElementById("syncStatus").style.color = "green";
    }
  } catch (e) {
    document.getElementById("syncStatus").innerText = "Lưu cục bộ thành công! Lỗi Cloud.";
    document.getElementById("syncStatus").style.color = "orange";
  }
}

async function updateLinkStats(isSuccess) {
  if (!currentLink) return;
  
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      method: "GET", headers: { "X-Master-Key": JSONBIN_KEY }
    });
    const data = await res.json();
    let records = data.record ? data.record : data;
    if (Array.isArray(records)) {
      cloudFavorites = records.map(item => typeof item === 'string' ? {url:item, successCount:0, cancelCount:0} : item);
    }
  } catch(e) {}

  let target = cloudFavorites.find(item => item.url === currentLink);
  
  if (target) {
    if (isSuccess) target.successCount = (target.successCount || 0) + 1;
    else target.cancelCount = (target.cancelCount || 0) + 1;
  } else {
    if (isSuccess) {
      cloudFavorites.push({ url: currentLink, successCount: 1, cancelCount: 0 });
      showPopup("Phát hiện link hiệu quả! Đã tự động lưu lên Đám mây.");
    } else {
      return;
    }
  }
  
  renderFavoritesList();
  await saveCloudData();
}

async function getNumber() {
  document.getElementById("loading").style.display = "inline";
  const link = document.getElementById("apiLink").value.trim();
  if (!link.includes("getNumber") && !link.includes("action=")) {
    document.getElementById("loading").style.display = "none";
    return alert("Link không đúng cấu trúc API.");
  }
  resetAll();
  clearInterval(checkInterval);
  currentLink = link; 
  cacheApiLink();
  
  try {
    const parsed = new URL(link);
    baseURL = parsed.origin + parsed.pathname;
    apiKey = parsed.searchParams.get("api_key") || parsed.searchParams.get("apikey") || parsed.searchParams.get("token");
  } catch(e) {
    document.getElementById("loading").style.display = "none";
    return alert("Đường dẫn link bị lỗi định dạng.");
  }

  try {
    const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(link));
    const text = await res.text();
    let id = "", number = ""; price = "";
    const raw = text.trim();

    if (raw.startsWith("ACCESS_NUMBER") || raw.startsWith("ACCESS_READY")) {
      const parts = raw.split(":");
      id = parts[1] || ""; number = parts[2] || "";
      if (parts[3]) price = parts[3];
    }

    if (id && number) {
      currentId = id;
      document.getElementById("number").value = number;
      document.getElementById("phoneSection").style.display = "block";
      document.getElementById("otpSection").style.display = "block";
      document.getElementById("cancelBtn").style.display = "inline-block";
      document.getElementById("otp1-loading").style.display = "inline";

      if (price) {
        document.getElementById("priceBadge").textContent = "Giá: " + price;
        document.getElementById("priceBadge").style.display = "inline-block";
      }
      
      if(navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(number).then(() => showPopup("Đã tự động sao chép số!"));
      }
      saveCurrentActiveStateToCache(number);
      updateRecentPhonesCache(number, id, baseURL, apiKey, price, currentLink);
      startOTPCheck();
    } else { 
      alert("Không lấy được số.\n" + text); 
      await updateLinkStats(false);
    }
  } catch (e) { alert("Lỗi: " + e.message); }
  document.getElementById("loading").style.display = "none";
}

async function checkOTP() {
  if (!currentId) return;
  const url = `${baseURL}?api_key=${apiKey}&action=getStatus&id=${currentId}&nocache=${Math.random()}`;
  const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
  const text = await res.text();

  if (text.startsWith("STATUS_OK")) {
    const code = text.split(":")[1];
    let idx = otpCodes.findIndex(v => !v);
    if (idx === -1) return;
    if (idx > 0 && code === otpCodes[idx - 1]) {
      await requestNextOTP(idx + 1); return;
    }
    
    if (idx === 0) {
      await updateLinkStats(true);
    }

    otpCodes[idx] = code;
    
    // Đồng bộ lại bộ lưu trữ máy hiện tại khi có OTP mới về
    const currentNumVal = document.getElementById("number").value;
    saveCurrentActiveStateToCache(currentNumVal);

    document.getElementById("otp" + (idx + 1)).innerText = code;
    document.getElementById("otp" + (idx + 1) + "-loading").style.display = "none";
    
    if (idx < 8) {
      document.getElementById("otp" + (idx + 2) + "-loading").style.display = "inline";
      await requestNextOTP(idx + 2);
    }
  } else if (text === "STATUS_CANCELED") {
    showPopup("Số đã bị hệ thống hủy!");
    resetAll();
  }
}

async function requestNextOTP(n) {
  const url = `${baseURL}?api_key=${apiKey}&action=setStatus&id=${currentId}&status=3`;
  await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
}

function startOTPCheck() {
  clearInterval(checkInterval);
  checkInterval = setInterval(checkOTP, 5000);
}

async function cancelOrder() {
  const url = `${baseURL}?api_key=${apiKey}&action=setStatus&id=${currentId}&status=8`;
  await fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
  showPopup("Đã hủy số!"); 
  await updateLinkStats(false); 
  resetAll();
}

function resetAll() {
  clearInterval(checkInterval);
  otpCodes = ["","","","","","","","",""]; currentId = ""; baseURL = ""; apiKey = ""; price = "";
  localStorage.removeItem("otp_current_active_state");
  document.getElementById("number").value = "";
  for (let i = 1; i <= 9; i++) {
    document.getElementById("otp" + i).innerText = "___";
    document.getElementById("otp" + i + "-loading").style.display = "none";
  }
  document.getElementById("priceBadge").style.display = "none";
  document.getElementById("phoneSection").style.display = "none";
  document.getElementById("otpSection").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";
}

function saveToFavorites() {
  const urlInput = document.getElementById("favUrlInput").value.trim();
  if (!urlInput) return alert("Vui lòng nhập hoặc dán link trước!");
  if (!cloudFavorites.some(item => item.url === urlInput)) {
    cloudFavorites.push({ url: urlInput, successCount: 0, cancelCount: 0 });
    renderFavoritesList(); saveCloudData();
  }
  document.getElementById("favUrlInput").value = "";
}

function removeFavoriteItem(e, targetLink) {
  e.stopPropagation();
  if(!confirm("Xóa link này khỏi danh sách trực tuyến?")) return;
  cloudFavorites = cloudFavorites.filter(item => item.url !== targetLink);
  renderFavoritesList(); saveCloudData();
}

function parseApiDetails(link) {
  let domain = "Unknown Web", serviceName = "Mặc định", countryName = "Mặc định", providerOrOperator = "Tự động";
  try {
    const urlObj = new URL(link);
    domain = urlObj.hostname.replace("www.", ""); 
    
    let s = urlObj.searchParams.get("service") || urlObj.searchParams.get("name") || urlObj.searchParams.get("service_id");
    if(s) {
      let sKey = s.toLowerCase().trim();
      serviceName = SERVICES_DICT[sKey] ? `${SERVICES_DICT[sKey]} (${s.toUpperCase()})` : s.toUpperCase();
    }
    let c = urlObj.searchParams.get("country") || urlObj.searchParams.get("country_id") || urlObj.searchParams.get("nation");
    if(c) {
      let cKey = String(c).trim();
      countryName = COUNTRIES_DICT[cKey] ? `${COUNTRIES_DICT[cKey]}` : `Mã ${c}`;
    }
    let op = urlObj.searchParams.get("operator") || urlObj.searchParams.get("provider") || urlObj.searchParams.get("provider_id") || urlObj.searchParams.get("providerIds");
    if(op) providerOrOperator = op;
  } catch(e) { domain = "API Link"; }
  return { domain, serviceName, countryName, providerOrOperator };
}

function renderFavoritesList() {
  const listContainer = document.getElementById("favUrlsList");
  listContainer.innerHTML = "";

  cloudFavorites.sort((a, b) => {
    let totalA = (a.successCount || 0) + (a.cancelCount || 0);
    let totalB = (b.successCount || 0) + (b.cancelCount || 0);
    let rateA = totalA > 0 ? (a.successCount || 0) / totalA : 0;
    let rateB = totalB > 0 ? (b.successCount || 0) / totalB : 0;
    if (rateB !== rateA) return rateB - rateA;
    return totalB - totalA;
  });

  cloudFavorites.forEach((item, idx) => {
    const link = item.url;
    const sCount = item.successCount || 0;
    const cCount = item.cancelCount || 0;
    const total = sCount + cCount;
    let sRate = total > 0 ? Math.round((sCount / total) * 100) : 0;
    let cRate = total > 0 ? Math.round((cCount / total) * 100) : 0;

    const row = document.createElement("div"); row.className = "fav-row-item";
    const details = parseApiDetails(link);
    const webBadge = document.createElement("div"); webBadge.className = "fav-web-name"; webBadge.innerText = details.domain;
    
    const infoDiv = document.createElement("div"); infoDiv.className = "fav-link-info";
    infoDiv.innerHTML = `${idx + 1}. Service: <span>${details.serviceName}</span> | Country: <span>${details.countryName}</span> | Net: <span>${details.providerOrOperator}</span>`;
    
    const statsBar = document.createElement("div"); statsBar.className = "fav-stats-bar";
    statsBar.innerHTML = `
      <span class="stat-success">✓ Về: ${sRate}% (${sCount} lần)</span>
      <span class="stat-cancel">✕ Hủy: ${cRate}% (${cCount} lần)</span>
      <span class="stat-total">Tổng: ${total}</span>
    `;

    row.onclick = () => {
      document.getElementById("apiLink").value = link;
      currentLink = link;
      cacheApiLink();
      showPopup("Đã chọn: " + details.domain + " [" + details.serviceName + "]");
    };
    const delBtn = document.createElement("span"); delBtn.className = "fav-row-del"; delBtn.innerText = "×";
    delBtn.onclick = (e) => removeFavoriteItem(e, link);
    
    row.appendChild(webBadge); row.appendChild(infoDiv); row.appendChild(statsBar); row.appendChild(delBtn);
    listContainer.appendChild(row);
  });
}

function updateRecentPhonesCache(number, id, bUrl, aKey, prc, lnk) {
  localPhonesCache = localPhonesCache.filter(item => item.number !== number);
  localPhonesCache.unshift({ number, id, bUrl, aKey, prc, lnk });
  if (localPhonesCache.length > 5) localPhonesCache.pop();
  localStorage.setItem("otp_local_phones_cache", JSON.stringify(localPhonesCache));
  renderRecentPhones();
}

function renderRecentPhones() {
  const boxContainer = document.getElementById("recentPhonesBox");
  const listContainer = document.getElementById("recentPhonesList");
  listContainer.innerHTML = "";
  if (localPhonesCache.length === 0) { boxContainer.style.display = "none"; return; }
  boxContainer.style.display = "block";
  localPhonesCache.forEach(item => {
    const btn = document.createElement("div"); btn.className = "history-number-btn"; btn.innerText = item.number;
    btn.onclick = () => {
      clearInterval(checkInterval);
      currentId = item.id; baseURL = item.bUrl; apiKey = item.aKey; price = item.prc; currentLink = item.lnk;
      document.getElementById("number").value = item.number;
      document.getElementById("phoneSection").style.display = "block";
      document.getElementById("otpSection").style.display = "block";
      document.getElementById("cancelBtn").style.display = "inline-block";
      if (price) {
        document.getElementById("priceBadge").textContent = "Giá: " + price;
        document.getElementById("priceBadge").style.display = "inline-block";
      } else { document.getElementById("priceBadge").style.display = "none"; }
      for (let i = 1; i <= 9; i++) {
        document.getElementById("otp" + i).innerText = "___";
        document.getElementById("otp" + i + "-loading").style.display = "none";
      }
      document.getElementById("otp1-loading").style.display = "inline";
      otpCodes = ["","","","","","","","",""];
      saveCurrentActiveStateToCache(item.number);
      startOTPCheck(); showPopup("Đã mở lại số: " + item.number);
    };
    listContainer.appendChild(btn);
  });
}
